name: Agent exec dogfood

on:
  push:
    branches:
      - dogfood/issue-8-agent-exec-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dogfood:
    name: Python repository dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out merged PCL runtime
        uses: actions/checkout@v4
        with:
          ref: df94bf9c5315f92cbc0847b72e074d89dd2d786b
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PCL and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run the real Python verification command through pcl exec
        env:
          PCL_AGENT_EXEC_STATE_DIR: ${{ runner.temp }}/pcl-agent-exec-python
          PCL_RELIABILITY_ARTIFACT_DIR: ${{ runner.temp }}/pcl-reliability-python
        run: |
          set +e
          pcl --json exec \
            --timeout-seconds 1800 \
            --max-output-bytes 8388608 \
            --allow-env PCL_RELIABILITY_ARTIFACT_DIR \
            -- pytest > "$RUNNER_TEMP/python-result.json"
          child_exit=$?
          set -e
          python - "$RUNNER_TEMP/python-result.json" "$child_exit" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          path = pathlib.Path(sys.argv[1])
          child_exit = int(sys.argv[2])
          payload = json.loads(path.read_text(encoding="utf-8"))
          raw_bytes = payload["raw"]["stdout_bytes"] + payload["raw"]["stderr_bytes"]
          exposed_bytes = payload["exposed"]["bytes"]
          reduction_ratio = 0.0 if raw_bytes == 0 else 1.0 - (exposed_bytes / raw_bytes)
          report = {
              "schema": "agent-exec-dogfood-observation/v1",
              "repository": "mocchalera/project-loop-harness",
              "family": "python",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "command": ["pytest"],
              "expected_status": "PASS",
              "observed_status": payload["status"],
              "child_exit": child_exit,
              "raw_bytes": raw_bytes,
              "exposed_bytes": exposed_bytes,
              "exposed_lines": payload["exposed"]["lines"],
              "reduction_ratio": round(reduction_ratio, 6),
              "follow_up_diagnostic_reads": 0,
              "false_classifications": 0 if payload["status"] == "PASS" and child_exit == 0 else 1,
              "run_id": payload["run_id"],
          }
          print("DOGFOOD_METRICS=" + json.dumps(report, sort_keys=True))
          print("DOGFOOD_RESULT=" + json.dumps(payload, sort_keys=True))
          PY
          test "$child_exit" -eq 0
      - name: Upload Python dogfood result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-exec-dogfood-python
          path: ${{ runner.temp }}/python-result.json
          if-no-files-found: error

  node-dogfood:
    name: Node repository dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out merged PCL runtime
        uses: actions/checkout@v4
        with:
          ref: df94bf9c5315f92cbc0847b72e074d89dd2d786b
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PCL
        run: python -m pip install -e .
      - name: Check out AGI Cockpit MCP
        uses: actions/checkout@v4
        with:
          repository: mocchalera/agi-cockpit-mcp
          ref: 9fa0e5f61559c12fb7a99e05b01df9c164726f80
          path: node-repo
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node-repo/package-lock.json
      - name: Install Node dependencies
        working-directory: node-repo
        run: npm ci
      - name: Run the real Node verification command through pcl exec
        working-directory: node-repo
        env:
          PCL_AGENT_EXEC_STATE_DIR: ${{ runner.temp }}/pcl-agent-exec-node
        run: |
          set +e
          pcl --json exec \
            --timeout-seconds 1200 \
            --max-output-bytes 8388608 \
            -- npm run verify:full > "$RUNNER_TEMP/node-result.json"
          child_exit=$?
          set -e
          python - "$RUNNER_TEMP/node-result.json" "$child_exit" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          path = pathlib.Path(sys.argv[1])
          child_exit = int(sys.argv[2])
          payload = json.loads(path.read_text(encoding="utf-8"))
          raw_bytes = payload["raw"]["stdout_bytes"] + payload["raw"]["stderr_bytes"]
          exposed_bytes = payload["exposed"]["bytes"]
          reduction_ratio = 0.0 if raw_bytes == 0 else 1.0 - (exposed_bytes / raw_bytes)
          report = {
              "schema": "agent-exec-dogfood-observation/v1",
              "repository": "mocchalera/agi-cockpit-mcp",
              "family": "node",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "command": ["npm", "run", "verify:full"],
              "expected_status": "PASS",
              "observed_status": payload["status"],
              "child_exit": child_exit,
              "raw_bytes": raw_bytes,
              "exposed_bytes": exposed_bytes,
              "exposed_lines": payload["exposed"]["lines"],
              "reduction_ratio": round(reduction_ratio, 6),
              "follow_up_diagnostic_reads": 0,
              "false_classifications": 0 if payload["status"] == "PASS" and child_exit == 0 else 1,
              "run_id": payload["run_id"],
          }
          print("DOGFOOD_METRICS=" + json.dumps(report, sort_keys=True))
          print("DOGFOOD_RESULT=" + json.dumps(payload, sort_keys=True))
          PY
          test "$child_exit" -eq 0
      - name: Upload Node dogfood result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-exec-dogfood-node
          path: ${{ runner.temp }}/node-result.json
          if-no-files-found: error
