name: Agent exec dogfood

on:
  push:
    branches:
      - dogfood/issue-8-agent-exec-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dogfood:
    name: Python repository dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out merged PCL runtime with frozen history fixtures
        uses: actions/checkout@v4
        with:
          ref: df94bf9c5315f92cbc0847b72e074d89dd2d786b
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PCL and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run the real Python test suite through pcl exec
        env:
          PCL_AGENT_EXEC_STATE_DIR: ${{ runner.temp }}/pcl-agent-exec-python
          PCL_RELIABILITY_ARTIFACT_DIR: ${{ runner.temp }}/pcl-reliability-python
        run: |
          set +e
          pcl --json exec \
            --timeout-seconds 1800 \
            --max-output-bytes 8388608 \
            --allow-env PCL_RELIABILITY_ARTIFACT_DIR \
            -- pytest > "$RUNNER_TEMP/python-result.json"
          child_exit=$?
          set -e

          run_id="$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/python-result.json"))["run_id"])')"
          follow_up_reads=0
          if [ "$child_exit" -ne 0 ]; then
            pcl exec show "$run_id" --errors | tee "$RUNNER_TEMP/python-diagnostic.txt"
            follow_up_reads=1
          else
            : > "$RUNNER_TEMP/python-diagnostic.txt"
          fi

          python - "$RUNNER_TEMP/python-result.json" "$child_exit" "$follow_up_reads" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          path = pathlib.Path(sys.argv[1])
          child_exit = int(sys.argv[2])
          follow_up_reads = int(sys.argv[3])
          payload = json.loads(path.read_text(encoding="utf-8"))
          raw_bytes = payload["raw"]["stdout_bytes"] + payload["raw"]["stderr_bytes"]
          exposed_bytes = payload["exposed"]["bytes"]
          reduction_ratio = 0.0 if raw_bytes == 0 else 1.0 - (exposed_bytes / raw_bytes)
          classified_success = payload["status"] == "PASS"
          actual_success = child_exit == 0
          report = {
              "schema": "agent-exec-dogfood-observation/v1",
              "repository": "mocchalera/project-loop-harness",
              "family": "python",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "command": ["pytest"],
              "expected_status": "PASS",
              "observed_status": payload["status"],
              "child_exit": child_exit,
              "raw_bytes": raw_bytes,
              "exposed_bytes": exposed_bytes,
              "exposed_lines": payload["exposed"]["lines"],
              "reduction_ratio": round(reduction_ratio, 6),
              "follow_up_diagnostic_reads": follow_up_reads,
              "false_classifications": 0 if classified_success == actual_success else 1,
              "run_id": payload["run_id"],
          }
          print("DOGFOOD_METRICS=" + json.dumps(report, sort_keys=True))
          print("DOGFOOD_RESULT=" + json.dumps(payload, sort_keys=True))
          PY
          test "$child_exit" -eq 0
      - name: Upload bounded Python dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-exec-dogfood-python
          path: |
            ${{ runner.temp }}/python-result.json
            ${{ runner.temp }}/python-diagnostic.txt
          if-no-files-found: error
